server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;

    # Redirects stay relative, so they work behind any ingress or port.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    include /etc/nginx/snippets/security-headers.conf;

    error_page 404 /404.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets (JS, CSS, fonts) never change under the same name.
    location ^~ /_next/static/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Screenshots and icons: not hashed, so cache for a day.
    location ~* \.(?:png|jpg|jpeg|webp|svg|ico)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # The static search index, fetched by the browser.
    location = /api/search {
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # The docs have no index page of their own.
    location = /docs {
        return 302 /docs/getting-started;
    }
    location = /docs/ {
        return 302 /docs/getting-started;
    }

    location = /404.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Pages (/docs/foo is out/docs/foo.html) and their React Server Component
    # payloads (.txt), revalidated on each visit.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/index.html =404;
    }
}
