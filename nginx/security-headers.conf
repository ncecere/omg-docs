# Included in the server block and in every location that sets its own
# headers (nginx doesn't inherit add_header into such locations).
#
# script-src needs 'unsafe-inline': a Next.js static export inlines its page
# data and the theme script. Nothing on the site takes user input or loads
# third-party code, and connect-src/img-src/font-src stay 'self'.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; manifest-src 'self'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; worker-src 'self'" always;
